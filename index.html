<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ôn thi: Vé máy bay – Xuất nhập cảnh – Hải quan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  
  /* Dark theme (default) */
  --bg-base: #090d16;
  --bg-gradient: radial-gradient(ellipse at 50% -20%, #1e1b4b 0%, #0a0e1a 60%, #05070c 100%);
  --surface: rgba(18, 24, 38, 0.88);
  --surface-solid: #131a29;
  --surface-hover: rgba(30, 41, 59, 0.85);
  --surface-elevated: #1a2336;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --border-focus: #6366f1;
  
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --text-sub: #64748b;
  
  --primary: #6366f1;
  --primary-glow: rgba(99, 102, 241, 0.35);
  --primary-light: #818cf8;
  --primary-dark: #4f46e5;
  --primary-bg: rgba(99, 102, 241, 0.12);
  
  --success: #10b981;
  --success-glow: rgba(16, 185, 129, 0.35);
  --success-bg: rgba(16, 185, 129, 0.12);
  --success-border: rgba(16, 185, 129, 0.3);
  
  --danger: #f43f5e;
  --danger-glow: rgba(244, 63, 94, 0.35);
  --danger-bg: rgba(244, 63, 94, 0.12);
  --danger-border: rgba(244, 63, 94, 0.3);
  
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.12);
  
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.4), 0 4px 12px -2px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 16px 36px -6px rgba(0, 0, 0, 0.5), 0 8px 16px -4px rgba(0, 0, 0, 0.35);
  
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 26px;
}

[data-theme="light"] {
  --bg-base: #f8fafc;
  --bg-gradient: radial-gradient(ellipse at 50% -20%, #e0e7ff 0%, #f1f5f9 60%, #f8fafc 100%);
  --surface: rgba(255, 255, 255, 0.94);
  --surface-solid: #ffffff;
  --surface-hover: #f1f5f9;
  --surface-elevated: #ffffff;
  --border: rgba(148, 163, 184, 0.22);
  --border-strong: rgba(148, 163, 184, 0.38);
  --border-focus: #4f46e5;
  
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-sub: #64748b;
  
  --primary: #4f46e5;
  --primary-glow: rgba(79, 70, 229, 0.25);
  --primary-light: #6366f1;
  --primary-dark: #4338ca;
  --primary-bg: rgba(79, 70, 229, 0.08);
  
  --success: #059669;
  --success-glow: rgba(5, 150, 105, 0.25);
  --success-bg: rgba(5, 150, 105, 0.08);
  --success-border: rgba(5, 150, 105, 0.25);
  
  --danger: #e11d48;
  --danger-glow: rgba(225, 29, 72, 0.25);
  --danger-bg: rgba(225, 29, 72, 0.08);
  --danger-border: rgba(225, 29, 72, 0.25);
  
  --warning: #d97706;
  --warning-bg: rgba(217, 119, 6, 0.1);
  
  --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 30px -10px rgba(15, 23, 42, 0.12), 0 10px 15px -5px rgba(15, 23, 42, 0.06);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  min-height: -webkit-fill-available;
  background: var(--bg-base);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-main);
  font-size: 15px;
  line-height: 1.5;
  padding: max(env(safe-area-inset-top), 10px) 12px max(env(safe-area-inset-bottom), 18px);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: background-color 0.3s ease, color 0.3s ease;
  overflow-x: hidden;
}

/* App Wrapper */
.app-container {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  z-index: 1;
}

/* Header */
header {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 12px var(--primary-glow);
  flex-shrink: 0;
  color: #fff;
}

.brand-text {
  min-width: 0;
}

.brand-text h1 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-main);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-text p {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-hover);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.icon-btn:hover {
  background: var(--surface-solid);
  border-color: var(--border-strong);
  transform: translateY(-1px);
}

.icon-btn:active {
  transform: scale(0.92);
}

/* Navigation Tab Bar */
nav.tab-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  padding: 4px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}

.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 2px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
}

.tab-btn .tab-icon {
  font-size: 17px;
  line-height: 1;
}

.tab-btn:hover {
  color: var(--text-main);
  background: var(--surface-hover);
}

.tab-btn.active {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 4px 12px var(--primary-glow);
}

/* Main Content Area */
#v {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

/* Card Box */
.card-box {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: visible;
  transition: border-color 0.2s ease;
}

/* Utility Elements */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: 20px;
  background: var(--primary-bg);
  color: var(--primary-light);
  border: 1px solid rgba(99, 102, 241, 0.25);
}

.badge.success {
  background: var(--success-bg);
  color: var(--success);
  border-color: var(--success-border);
}

.progress-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.progress-track {
  width: 100%;
  height: 6px;
  background: var(--surface-hover);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 14px;
  position: relative;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
  border-radius: 99px;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 8px var(--primary-glow);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 16px;
  min-height: 44px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  background: var(--surface-hover);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
  touch-action: manipulation;
}

.btn:hover {
  background: var(--surface-solid);
  border-color: var(--border-focus);
}

.btn:active {
  transform: scale(0.96);
}

.btn.primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #ffffff;
  border-color: var(--primary);
  box-shadow: 0 4px 14px var(--primary-glow);
}

.btn.success {
  background: linear-gradient(135deg, var(--success) 0%, #047857 100%);
  color: #ffffff;
  border-color: var(--success);
  box-shadow: 0 4px 14px var(--success-glow);
}

.btn.danger {
  background: var(--danger-bg);
  color: var(--danger);
  border-color: var(--danger-border);
}

.btn.danger:hover {
  background: var(--danger);
  color: #fff;
}

.btn-group {
  display: flex;
  gap: 8px;
  width: 100%;
}

.btn-group > * {
  flex: 1;
}

/* ==========================================================================
   3D FLASHCARD (SOLVED AUTO-HEIGHT & ZERO CLIPPING)
   ========================================================================== */
.flashcard-wrapper {
  perspective: 1400px;
  width: 100%;
  margin-bottom: 14px;
  user-select: none;
  touch-action: pan-y;
  cursor: pointer;
}

/* Use CSS Grid so the card container stretches to the maximum height of BOTH faces! */
.flashcard-3d {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
  width: 100%;
  min-height: 220px;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.34, 1.25, 0.64, 1);
  position: relative;
}

.flashcard-wrapper.flipped .flashcard-3d {
  transform: rotateY(180deg);
}

.card-face {
  grid-column: 1 / 2;
  grid-row: 1 / 2;
  width: 100%;
  min-height: 100%;
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-sizing: border-box;
  background: var(--surface-solid);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-sm);
  position: relative;
  transition: border-color 0.2s ease, opacity 0.2s ease;
}

.card-face::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), #a855f7);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

.card-face.card-front {
  transform: rotateY(0deg);
  z-index: 2;
  visibility: visible;
  pointer-events: auto;
}

.card-face.card-back {
  transform: rotateY(180deg);
  background: var(--surface-elevated);
  border-color: rgba(99, 102, 241, 0.35);
  z-index: 1;
  visibility: hidden;
  pointer-events: none;
}

.card-face.card-back::before {
  background: linear-gradient(90deg, #10b981, #06b6d4);
}

/* Visibility toggling guarantees zero clipping and perfect click behavior across all browsers */
.flashcard-wrapper.flipped .card-face.card-front {
  visibility: hidden;
  pointer-events: none;
}

.flashcard-wrapper.flipped .card-face.card-back {
  visibility: visible;
  pointer-events: auto;
}

.card-face-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.card-face-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 6px 0;
  width: 100%;
  max-height: 60vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.card-question {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.45;
  color: var(--text-main);
  letter-spacing: -0.01em;
  word-break: break-word;
}

.card-question.code-font {
  font-family: var(--font-mono);
  font-size: 14.5px;
  background: var(--surface-hover);
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  letter-spacing: 0.02em;
  word-break: break-word;
  line-height: 1.5;
  text-align: left;
  width: 100%;
}

.card-answer-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  width: 100%;
}

.answer-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13.5px;
  line-height: 1.45;
  background: var(--surface-hover);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  word-break: break-word;
}

.answer-item .dot {
  color: var(--success);
  font-size: 14px;
  line-height: 1.2;
  flex-shrink: 0;
  margin-top: 1px;
}

.card-face-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sub);
  margin-top: 10px;
}

.keyboard-hints {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 8px;
  text-align: center;
}

.kbd {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-hover);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
}

/* Quiz Styles */
.quiz-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.quiz-score-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 30px;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-main);
}

.quiz-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.45;
  color: var(--text-main);
  margin-top: 4px;
  word-break: break-word;
}

.options-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}

.quiz-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  min-height: 48px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  background: var(--surface-hover);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  touch-action: manipulation;
}

.quiz-opt:hover:not(:disabled) {
  background: var(--surface-solid);
  border-color: var(--primary-light);
}

.quiz-opt:active:not(:disabled) {
  transform: scale(0.98);
}

.opt-prefix {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--surface-solid);
  border: 1px solid var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.quiz-opt.ok {
  border-color: var(--success);
  background: var(--success-bg);
  color: var(--text-main);
  box-shadow: 0 0 12px var(--success-glow);
}

.quiz-opt.ok .opt-prefix {
  background: var(--success);
  color: #fff;
  border-color: var(--success);
}

.quiz-opt.no {
  border-color: var(--danger);
  background: var(--danger-bg);
  color: var(--text-main);
  animation: shake 0.4s ease;
}

.quiz-opt.no .opt-prefix {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}

.quiz-opt:disabled {
  cursor: default;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%, 75% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
}

.quiz-feedback {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 13.5px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.quiz-feedback.correct {
  background: var(--success-bg);
  border: 1px solid var(--success-border);
  color: var(--success);
}

.quiz-feedback.incorrect {
  background: var(--danger-bg);
  border: 1px solid var(--danger-border);
  color: var(--danger);
}

/* Boarding Pass (Flight Time & Gathering) */
.boarding-pass {
  background: var(--surface-solid);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}

.boarding-pass-header {
  background: linear-gradient(135deg, var(--primary-dark) 0%, #312e81 100%);
  color: #ffffff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.flight-number {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.boarding-pass-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.route-display {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  text-align: center;
}

.airport-block h2 {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: 0.05em;
}

.airport-block p {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}

.route-arrow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.plane-line {
  display: flex;
  align-items: center;
  width: 60px;
}

.plane-line::before, .plane-line::after {
  content: '';
  height: 2px;
  background: var(--border-strong);
  flex: 1;
}

.plane-icon {
  font-size: 18px;
  color: var(--primary-light);
  padding: 0 4px;
  transform: rotate(90deg);
}

.flight-times-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  background: var(--surface-hover);
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}

.time-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.time-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-sub);
}

.time-val {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 700;
  color: var(--text-main);
}

.tz-notice {
  font-size: 12.5px;
  padding: 8px 12px;
  background: var(--primary-bg);
  border-left: 3px solid var(--primary);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-main);
  line-height: 1.45;
}

/* Number Inputs (iOS zoom-prevented with font-size: 16px) */

<div class="app-container">

    </div>
  </header>

  <!-- Segmented Tabs -->

      <span>Trắc nghiệm</span>
    </button>

      <span class="tab-icon">⏱️</span>
      <span>Tính giờ bay</span>
    </button>

      <span>Tra cứu</span>
    </button>
  </nav>

  <!-- Dynamic Views Container -->
  <div id="v"></div>

<script src="data.js"></script>
<script>
/* ==========================================================================
   APP LOGIC - Sử dụng dữ liệu từ data.js
   ========================================================================== */
// Data đã được tách ra file data.js

/* ==========================================================================
   STATE & UTILS
   ========================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const V = $("#v");

// Sound Effects Synthesizer (Zero external dependencies)
let soundEnabled = localStorage.getItem('app_sound') !== 'false';
function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    if (type === 'flip') {
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } else if (type === 'correct') {
      osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.09); // E5
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else if (type === 'wrong') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(260, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    }
  } catch (e) {}
}

// Confetti Particle System
function launchConfetti() {
  const canvas = $("#confetti-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const particles = [];
  const colors = ["#6366f1", "#10b981", "#f59e0b", "#ec4899", "#3b82f6", "#8b5cf6"];
  
  for (let idx = 0; idx < 80; idx++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height * 0.4,
      w: Math.random() * 8 + 4,
      h: Math.random() * 6 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.7) * 16,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      opacity: 1
    });
  }
  
  let frame = 0;
  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;
      p.rot += p.rotSpeed;
      p.opacity -= 0.009;
      if (p.opacity > 0) {
        alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
    });
    frame++;
    if (alive && frame < 180) {
      requestAnimationFrame(update);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(update);
}

// Theme Handling
const savedTheme = localStorage.getItem('app_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
document.documentElement.setAttribute('data-theme', savedTheme);

function updateThemeIcons() {
  const current = document.documentElement.getAttribute('data-theme');
  $("#themeBtn").textContent = current === 'dark' ? '☀️' : '🌙';
  $("#soundBtn").textContent = soundEnabled ? '🔊' : '🔇';
}
updateThemeIcons();

$("#themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  localStorage.setItem('app_theme', nxt);
  updateThemeIcons();
};

$("#soundBtn").onclick = () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem('app_sound', soundEnabled);
  updateThemeIcons();
};

/* Tab Navigation */
let currentTab = 0;
function tab(n) {
  currentTab = n;
  [0, 1, 2, 3].forEach(k => {
    const btn = $("#t" + k);
    if (btn) btn.classList.toggle("active", k === n);
  });
  [card, quiz, calc, searchView][n]();
}
[0, 1, 2, 3].forEach(k => {
  const btn = $("#t" + k);
  if (btn) btn.onclick = () => tab(k);
});

/* ==========================================================================
   TAB 0: FLASHCARDS (THẺ GHI NHỚ) - SOLVED OVERFLOW & TOUCH SWIPE
   ========================================================================== */
let i = 0, flip = false, deck = [...CARDS.keys()], known = new Set();

function formatAnswer(text) {
  const lines = text.split('\n').filter(l => l.trim().length > 0);
  if (lines.length > 1) {
    return `<div class="card-answer-list">` + 
      lines.map(line => `<div class="answer-item"><span class="dot">✦</span><span>${escapeHtml(line)}</span></div>`).join('') +
      `</div>`;
  }
  if (text.includes(' · ')) {
    const parts = text.split(' · ');
    return `<div class="card-answer-list">` + 
      parts.map(p => `<div class="answer-item"><span class="dot">✦</span><span>${escapeHtml(p)}</span></div>`).join('') +
      `</div>`;
  }
  return `<p class="card-question" style="font-size:16px;font-weight:600;">${escapeHtml(text)}</p>`;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function card() {
  if (!deck.length) {
    launchConfetti();
    V.innerHTML = `
      <div class="card-box celebrate-card">
        <div class="celebrate-icon">🏆</div>
        <h2>Chúc mừng bạn đã hoàn thành!</h2>
        <p>Bạn đã ghi nhớ toàn bộ <b>${CARDS.length} thẻ kiến thức</b> nghiệp vụ.</p>
        <div class="btn-group" style="max-width:280px;margin:0 auto;">
          <button class="btn primary" id="resetDeck">
            <span>🔄</span> Học lại từ đầu
          </button>
        </div>
      </div>
    `;
    $("#resetDeck").onclick = () => {
      known.clear();
      deck = [...CARDS.keys()];
      i = 0;
      card();
    };
    return;
  }

  i %= deck.length;
  const currentCard = CARDS[deck[i]];
  const progressPct = Math.round((known.size / CARDS.length) * 100);
  const isTicketCode = currentCard[0].includes(' ') && (currentCard[0].includes('HK') || currentCard[0].includes('DOCS') || currentCard[0].includes('SJW') || currentCard[0].includes('SGN'));

  V.innerHTML = `
    <div class="card-box">
      <!-- Progress Bar -->
      <div class="progress-header">
        <span>Thẻ ${i + 1} / ${deck.length} (Còn lại)</span>
        <span class="badge ${known.size > 0 ? 'success' : ''}">Đã thuộc: ${known.size} / ${CARDS.length} (${progressPct}%)</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width: ${progressPct}%"></div>
      </div>

      <!-- 3D Flip Card Container with Grid Auto-Height -->
      <div class="flashcard-wrapper ${flip ? 'flipped' : ''}" id="cardWrapper">
        <div class="flashcard-3d">
          <!-- Card Front -->
          <div class="card-face card-front">
            <div class="card-face-header">
              <span class="badge">Mặt trước · Đề bài / Thuật ngữ</span>
              <span style="font-size: 12px; color: var(--text-sub); font-weight:700;">#${deck[i] + 1}</span>
            </div>
            <div class="card-face-body">
              <div class="card-question ${isTicketCode ? 'code-font' : ''}">
                ${escapeHtml(currentCard[0])}
              </div>
            </div>
            <div class="card-face-footer">
              <span>👆 Chạm vào thẻ để lật xem đáp án</span>
            </div>
          </div>

          <!-- Card Back -->
          <div class="card-face card-back">
            <div class="card-face-header">
              <span class="badge success">Mặt sau · Giải nghĩa chi tiết</span>
              <span style="font-size: 12px; color: var(--text-sub); font-weight:700;">#${deck[i] + 1}</span>
            </div>
            <div class="card-face-body">
              ${formatAnswer(currentCard[1])}
            </div>
            <div class="card-face-footer">
              <span>👆 Chạm để lật lại mặt trước</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="btn-group">
        <button class="btn danger" id="btnNo" title="Phím tắt: [←] hoặc vuốt trái">
          <span>🔄</span> Chưa thuộc
        </button>
        <button class="btn" id="btnFlip" title="Phím tắt: [Space]">
          <span>🔁</span> Lật thẻ
        </button>
        <button class="btn success" id="btnOk" title="Phím tắt: [→] hoặc vuốt phải">
          <span>✨</span> Đã thuộc
        </button>
      </div>

      <div class="keyboard-hints">
        <span class="desktop-hint">Phím tắt: <span class="kbd">Space</span> Lật · <span class="kbd">←</span> Chưa thuộc · <span class="kbd">→</span> Đã thuộc</span>
        <span class="mobile-hint">💡 <b>Vuốt phải:</b> Đã thuộc · <b>Vuốt trái:</b> Chưa thuộc · <b>Chạm:</b> Lật thẻ</span>
      </div>
    </div>
  `;

  const wrapper = $("#cardWrapper");

  // Touch & Swipe Support for Mobile
  let touchStartX = 0, touchStartY = 0, isTouchMoving = false;

  wrapper.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    isTouchMoving = false;
  }, { passive: true });

  wrapper.addEventListener('touchmove', e => {
    const diffX = e.touches[0].clientX - touchStartX;
    const diffY = e.touches[0].clientY - touchStartY;
    if (Math.abs(diffX) > 15 && Math.abs(diffX) > Math.abs(diffY)) {
      isTouchMoving = true;
      const rot = Math.max(-10, Math.min(10, diffX * 0.06));
      wrapper.style.transform = `translateX(${diffX * 0.25}px) rotate(${rot}deg)`;
    }
  }, { passive: true });

  wrapper.addEventListener('touchend', e => {
    wrapper.style.transform = '';
    const diffX = e.changedTouches[0].clientX - touchStartX;
    const diffY = e.changedTouches[0].clientY - touchStartY;

    if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY)) {
      // Horizontal swipe detected
      if (diffX > 60) {
        $("#btnOk").click();
      } else {
        $("#btnNo").click();
      }
    } else if (!isTouchMoving && Math.abs(diffX) < 15 && Math.abs(diffY) < 15) {
      // Tap detected
      flip = !flip;
      playSound('flip');
      wrapper.classList.toggle('flipped', flip);
    }
  });

  // Desktop Click
  wrapper.onclick = e => {
    // If it's a touch device, touchend already handled it
    if (window.matchMedia('(pointer: coarse)').matches) return;
    flip = !flip;
    playSound('flip');
    wrapper.classList.toggle('flipped', flip);
  };

  $("#btnFlip").onclick = () => {
    flip = !flip;
    playSound('flip');
    wrapper.classList.toggle('flipped', flip);
  };

  $("#btnOk").onclick = () => {
    playSound('correct');
    known.add(deck[i]);
    deck.splice(i, 1);
    flip = false;
    card();
  };

  $("#btnNo").onclick = () => {
    playSound('flip');
    i++;
    flip = false;
    card();
  };
}

/* Keyboard Navigation */
window.onkeydown = e => {
  if (currentTab === 0) {
    if (e.code === 'Space') {
      e.preventDefault();
      $("#btnFlip") && $("#btnFlip").click();
    } else if (e.code === 'ArrowLeft' || e.key === '1') {
      e.preventDefault();
      $("#btnNo") && $("#btnNo").click();
    } else if (e.code === 'ArrowRight' || e.key === '2') {
      e.preventDefault();
      $("#btnOk") && $("#btnOk").click();
    }
  } else if (currentTab === 1) {
    if (e.code === 'Enter') {
      const nextBtn = $("#nx");
      if (nextBtn) nextBtn.click();
    } else if (['1', '2', '3', '4'].includes(e.key)) {
      const idx = parseInt(e.key) - 1;
      const opts = $$(".quiz-opt");
      if (opts[idx] && !opts[idx].disabled) opts[idx].click();
    }
  }
};

/* ==========================================================================
   TAB 1: QUIZ (TRẮC NGHIỆM)
   ========================================================================== */
let q = [], qi = 0, sc = 0, streak = 0;

function quiz() {
  if (!q.length) {
    q = [...QS].sort(() => Math.random() - 0.5);
    qi = 0;
    sc = 0;
    streak = 0;
  }

  if (qi >= q.length) {
    const pct = Math.round((sc / q.length) * 100);
    let gradeMsg = "Cần ôn tập thêm!";
    let gradeIcon = "📚";
    if (pct >= 90) {
      gradeMsg = "Xuất sắc! Nắm cực kỳ vững nghiệp vụ!";
      gradeIcon = "🌟";
      launchConfetti();
    } else if (pct >= 75) {
      gradeMsg = "Rất tốt! Bạn đã vượt qua bài thi xuất sắc!";
      gradeIcon = "🎉";
      launchConfetti();
    } else if (pct >= 50) {
      gradeMsg = "Khá tốt! Ôn lại các câu sai để đạt điểm tối đa!";
      gradeIcon = "👍";
    }

    V.innerHTML = `
      <div class="card-box celebrate-card">
        <div class="celebrate-icon">${gradeIcon}</div>
        <h2>Kết Quả: ${sc} / ${q.length} (${pct}%)</h2>
        <p>${gradeMsg}</p>
        <div class="btn-group" style="max-width:280px;margin:0 auto;">
          <button class="btn primary" id="btnRestartQuiz">
            <span>🔄</span> Làm lại đề khác
          </button>
        </div>
      </div>
    `;
    $("#btnRestartQuiz").onclick = () => {
      q = [];
      quiz();
    };
    return;
  }

  const [t, o, a] = q[qi];
  const progressPct = Math.round((qi / q.length) * 100);

  V.innerHTML = `
    <div class="card-box">
      <!-- Top Bar -->
      <div class="quiz-header-bar">
        <div class="badge">Câu ${qi + 1} / ${q.length}</div>
        <div class="quiz-score-pill">
          <span>🏆 Điểm: <b>${sc}</b></span>
          ${streak > 1 ? `<span style="color:var(--warning);">🔥 ${streak}</span>` : ''}
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width: ${progressPct}%"></div>
      </div>

      <!-- Question -->
      <div>
        <h2 class="quiz-title">${escapeHtml(t)}</h2>
      </div>

      <!-- Options -->
      <div class="options-grid" id="o"></div>

      <!-- Feedback Area -->
      <div id="f"></div>
      <div class="btn-group" id="n" style="margin-top:14px;"></div>
    </div>
  `;

  const optContainer = $("#o");
  const prefixes = ["A", "B", "C", "D"];

  o.forEach((optText, k) => {
    const b = document.createElement("button");
    b.className = "quiz-opt";
    b.innerHTML = `
      <span class="opt-prefix">${prefixes[k]}</span>
      <span style="flex:1;">${escapeHtml(optText)}</span>
    `;

    b.onclick = () => {
      const allBtns = [...optContainer.children];
      allBtns.forEach((e, j) => {
        e.disabled = true;
        if (j === a) {
          e.classList.add("ok");
        }
      });

      if (k === a) {
        sc++;
        streak++;
        playSound('correct');
        $("#f").innerHTML = `
          <div class="quiz-feedback correct">
            <span>✅</span>
            <span>Chính xác! Đáp án: <b>${prefixes[a]}. ${escapeHtml(o[a])}</b></span>
          </div>
        `;
      } else {
        streak = 0;
        b.classList.add("no");
        playSound('wrong');
        $("#f").innerHTML = `
          <div class="quiz-feedback incorrect">
            <span>❌</span>
            <span>Chưa chính xác! Đáp án đúng: <b>${prefixes[a]}. ${escapeHtml(o[a])}</b></span>
          </div>
        `;
      }

      $("#n").innerHTML = `
        <button class="btn primary" id="nx" style="width:100%;">
          <span>${qi + 1 === q.length ? 'Xem kết quả' : 'Câu tiếp theo'}</span>
          <span>➔</span>
        </button>
      `;
      $("#nx").onclick = () => {
        qi++;
        quiz();
      };
    };
    optContainer.appendChild(b);
  });
}

/* ==========================================================================
   TAB 2: FLIGHT TIME & GATHERING CALCULATOR (TÍNH GIỜ BAY)
   ========================================================================== */
let s;
const hm = m => {
  m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
};

function calc() {
  const z = TZ[Math.floor(Math.random() * TZ.length)];
  const dep = Math.floor(Math.random() * 288) * 5;
  const dur = (210 + Math.floor(Math.random() * 30) * 10);
  const arrVN = dep + dur;
  const arrLocal = arrVN + z[1] * 60;
  s = { dur, dep, z, arrLocal };

  const day = Math.floor(arrLocal / 1440);
  const plus = day > 0 ? "+" + day : (day < 0 ? String(day) : "");
  const destCode = z[0].match(/\((.+)\)/) ? z[0].match(/\((.+)\)/)[1] : "DST";
  const destCity = z[0].split(" (")[0];

  V.innerHTML = `
    <div class="card-box">
      <!-- Boarding Pass Graphic -->
      <div class="boarding-pass">
        <div class="boarding-pass-header">
          <div class="flight-number">
            <span>✈️</span>
            <span>CHUYẾN BAY QUỐC TẾ</span>
          </div>
          <span class="badge" style="background:rgba(255,255,255,0.2);color:#fff;border:none;">THỰC HÀNH TÍNH GIỜ</span>
        </div>
        <div class="boarding-pass-body">
          <div class="route-display">
            <div class="airport-block">
              <h2>SGN</h2>
              <p>Tân Sơn Nhất (VN)</p>
            </div>
            <div class="route-arrow">
              <span class="badge" style="font-size:9px;padding:2px 6px;">BAY THẲNG</span>
              <div class="plane-line">
                <span class="plane-icon">✈</span>
              </div>
            </div>
            <div class="airport-block">
              <h2>${destCode}</h2>
              <p>${escapeHtml(destCity)}</p>
            </div>
          </div>

          <div class="flight-times-row">
            <div class="time-item">
              <span class="time-label">Khởi hành (Giờ VN)</span>
              <span class="time-val">${hm(dep)}</span>
            </div>
            <div class="time-item">
              <span class="time-label">Hạ cánh (${destCity})</span>
              <span class="time-val">${hm(arrLocal)} ${plus ? `<b style="color:var(--warning);font-size:13px;">(${plus})</b>` : ''}</span>
            </div>
          </div>

          <div class="tz-notice">
            📌 <b>Múi giờ:</b> ${destCity} <b>${z[1] > 0 ? "nhanh hơn (+ " + z[1] + "h)" : "chậm hơn (" + z[1] + "h)"}</b> so với Việt Nam.
          </div>
        </div>
      </div>

      <!-- Flight Time Calculation Input -->
      <h3 style="font-size:15px;font-weight:700;margin-bottom:6px;">1. Tính thời gian bay thực tế:</h3>
      
      <div style="background:var(--warning-bg);border-left:3px solid var(--warning);padding:10px 12px;border-radius:8px;margin-bottom:12px;">
        <div style="font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:4px;">💡 Phương pháp tính (3 bước):</div>
        <div style="font-size:12.5px;color:var(--text-muted);line-height:1.5;">
          <b>Bước 1:</b> Xác định múi giờ (${destCity} ${z[1] > 0 ? "nhanh hơn" : (z[1] < 0 ? "chậm hơn" : "cùng giờ với")} VN ${Math.abs(z[1])}h)<br>
          <b>Bước 2:</b> Đổi giờ hạ cánh về giờ VN (${z[1] > 0 ? "trừ đi" : (z[1] < 0 ? "cộng thêm" : "giữ nguyên")} ${Math.abs(z[1])}h)<br>
          <b>Bước 3:</b> Lấy [Giờ đến (VN)] − [Giờ khởi hành] = Thời gian bay
        </div>
      </div>
      
      <details style="margin-bottom:12px;background:var(--surface-hover);border:1px solid var(--border);padding:10px 12px;border-radius:8px;cursor:pointer;">
        <summary style="font-size:13px;font-weight:700;color:var(--primary-light);user-select:none;">
          📖 Xem ví dụ minh họa chi tiết
        </summary>
        <div style="font-size:12.5px;margin-top:8px;line-height:1.6;color:var(--text-muted);">
          <b>Ví dụ:</b> SGN → Tokyo (NRT), khởi hành 23:55, hạ cánh 07:30 (giờ Tokyo)<br>
          Tokyo nhanh hơn VN 2 giờ<br><br>
          
          <b>Bước 1:</b> Tokyo nhanh hơn VN 2h<br>
          <b>Bước 2:</b> 07:30 (Tokyo) − 2h = <b>05:30 (giờ VN)</b><br>
          <b>Bước 3:</b> 05:30 − 23:55 = ?<br>
          → Qua ngày: (24:00 − 23:55) + 05:30 = 00:05 + 05:30 = <b>5h35 phút</b><br><br>
          
          💡 <b>Hoặc tính nhanh:</b> 05:30 + 24:00 − 23:55 = 29:30 − 23:55 = 5h35
        </div>
      </details>
      
      <p style="font-size:13.5px;color:var(--text-muted);margin-bottom:10px;">
        <b>⚠️ Lưu ý quan trọng:</b> Giờ trên vé luôn là giờ <u>địa phương</u> của từng sân bay. Phải đổi về cùng múi giờ trước khi trừ!
      </p>

      <div class="calc-inputs-row">
        <div class="input-stepper">
          <input id="h" type="number" min="0" max="24" placeholder="0" inputmode="numeric">
          <span class="input-unit">giờ</span>
        </div>
        <div class="input-stepper">
          <input id="m" type="number" min="0" max="59" step="5" placeholder="00" inputmode="numeric">
          <span class="input-unit">phút</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn primary" id="ck">
          <span>✔️</span> Kiểm tra
        </button>
        <button class="btn" id="nw">
          <span>🔄</span> Đề khác
        </button>
      </div>

      <div id="f" style="margin-top:12px;"></div>

      <hr style="border:0;border-top:1px solid var(--border);margin:20px 0;">

      <!-- Gathering Time Rule Section -->
      <h3 style="font-size:15px;font-weight:700;margin-bottom:6px;">2. Nghiệp vụ giờ tập trung đoàn tại sân bay:</h3>
      
      <div style="background:var(--surface-hover);border:1px solid var(--border);padding:10px 12px;border-radius:8px;margin-bottom:10px;">
        <div style="font-size:13px;color:var(--text-main);line-height:1.5;">
          <b>📋 Đề bài:</b> Chuyến bay cất cánh lúc <b style="color:var(--primary-light);">${hm(dep)}</b> ngày <b>${dep < 180 ? "15/03" : "14/03"}</b>.<br>
          <b>Đoàn:</b> 20 khách (đoàn đông) · <b>Loại:</b> Quốc tế<br>
          <b>Yêu cầu:</b> Tính giờ tập trung theo quy định trước <b>3 giờ</b>
        </div>
      </div>
      
      <div style="margin-top:10px;">
        <button class="btn" id="sh" style="width:100%;">
          <span>👁️</span> Xem giờ tập trung & Giải thích
        </button>
      </div>

      <div id="g" style="margin-top:12px;"></div>
    </div>
  `;

  $("#ck").onclick = () => {
    const t = (+$("#h").value || 0) * 60 + (+$("#m").value || 0);
    const durHours = Math.floor(dur / 60);
    const durMins = dur % 60;
    
    const arrVNModulo = ((arrVN % 1440) + 1440) % 1440;
    
    // Tạo giải thích chi tiết từng bước
    const step1_title = `<b>Bước 1: Xác định múi giờ</b>`;
    const step1_content = `${destCity} ${z[1] > 0 ? `nhanh hơn VN <b>${z[1]} giờ</b>` : (z[1] < 0 ? `chậm hơn VN <b>${Math.abs(z[1])} giờ</b>` : `cùng giờ với VN`)}`;
    
    const step2_title = `<b>Bước 2: Đổi giờ hạ cánh về giờ VN</b>`;
    const step2_explain = z[1] > 0 
      ? `Vì ${destCity} nhanh hơn, nên giờ VN sẽ <u>chậm hơn</u> → phải <b>TRỪ ĐI</b> ${z[1]}h`
      : (z[1] < 0 
        ? `Vì ${destCity} chậm hơn, nên giờ VN sẽ <u>nhanh hơn</u> → phải <b>CỘNG THÊM</b> ${Math.abs(z[1])}h`
        : `Cùng múi giờ → giữ nguyên`);
    const step2_calc = `${hm(arrLocal)} ${z[1] > 0 ? "− " + z[1] + "h" : (z[1] < 0 ? "+ " + Math.abs(z[1]) + "h" : "")} = <b style="color:var(--primary-light);">${hm(arrVNModulo)} (giờ VN)</b>`;
    
    const step3_title = `<b>Bước 3: Tính thời gian bay</b>`;
    const step3_calc = `${hm(arrVNModulo)} (giờ đến VN) − ${hm(dep)} (giờ đi) = <b style="color:var(--success);">${durHours}h${durMins > 0 ? ' ' + durMins + 'phút' : ''}</b>`;

    if (t === dur) {
      playSound('correct');
      $("#f").innerHTML = `
        <div class="quiz-feedback correct">
          <div style="width:100%;">
            <div style="font-size:15px;font-weight:700;margin-bottom:8px;">✅ Chính xác tuyệt đối!</div>
            <div style="font-size:13px;line-height:1.6;background:var(--surface-hover);padding:12px;border-radius:8px;">
              ${step1_title}<br>
              → ${step1_content}<br><br>
              ${step2_title}<br>
              → ${step2_explain}<br>
              → ${step2_calc}<br><br>
              ${step3_title}<br>
              → ${step3_calc}
            </div>
          </div>
        </div>
      `;
    } else {
      playSound('wrong');
      const userHours = Math.floor(t / 60);
      const userMins = t % 60;
      $("#f").innerHTML = `
        <div class="quiz-feedback incorrect">
          <div style="width:100%;">
            <div style="font-size:15px;font-weight:700;margin-bottom:4px;">❌ Chưa chính xác</div>
            <div style="font-size:13px;margin-bottom:8px;">
              Bạn trả lời: <b>${userHours}h${userMins > 0 ? ' ' + userMins + 'phút' : ''}</b> · 
              Đáp án đúng: <b style="color:var(--danger);">${durHours}h${durMins > 0 ? ' ' + durMins + 'phút' : ''}</b>
            </div>
            <div style="font-size:13px;line-height:1.6;background:var(--surface-hover);padding:12px;border-radius:8px;">
              <b>📚 Giải thích chi tiết:</b><br><br>
              ${step1_title}<br>
              → ${step1_content}<br><br>
              ${step2_title}<br>
              → ${step2_explain}<br>
              → ${step2_calc}<br><br>
              ${step3_title}<br>
              → ${step3_calc}
            </div>
            <div style="font-size:12px;margin-top:8px;color:var(--text-sub);">
              💡 <b>Mẹo nhớ:</b> Nước đến nhanh hơn thì TRỪ, chậm hơn thì CỘNG để về giờ VN!
            </div>
          </div>
        </div>
      `;
    }
  };

  $("#nw").onclick = calc;

  $("#sh").onclick = () => {
    const c = dep - 180; // Trừ 3 giờ (180 phút)
    const isNightBefore = c < 0;
    const gatheringTime = ((c % 1440) + 1440) % 1440; // Xử lý số âm
    const gatheringDate = isNightBefore ? (dep < 180 ? "14/03" : "13/03") : (dep < 180 ? "15/03" : "14/03");
    
    // Giải thích chi tiết
    const explanation = isNightBefore 
      ? `
        <b>Tại sao phải tập trung tối hôm trước?</b><br>
        • Giờ bay: ${hm(dep)} (sau 00:00 = rạng sáng)<br>
        • Trừ 3 giờ: ${hm(dep)} − 3h = ${hm(gatheringTime)}<br>
        • ${hm(gatheringTime)} < 00:00 → Phải lùi về <b>tối hôm trước</b>!<br><br>
        <b style="color:var(--warning);">⚠️ Lưu ý:</b> Chuyến bay sau 00:00 (rạng sáng) = bay "ngày mai" nhưng tập trung "tối hôm nay"!
      `
      : `
        <b>Cách tính:</b><br>
        • Giờ bay: ${hm(dep)}<br>
        • Trừ 3 giờ: ${hm(dep)} − 3h = ${hm(gatheringTime)}<br>
        • Cùng ngày ${gatheringDate} vì giờ tập trung vẫn trong ngày hôm đó.
      `;
    
    $("#g").innerHTML = `
      <div class="quiz-feedback correct" style="background:var(--primary-bg);border-color:rgba(99,102,241,0.3);color:var(--text-main);">
        <div style="width:100%;">
          <div style="font-size:15px;font-weight:700;color:var(--primary-light);margin-bottom:8px;">
            📍 Giờ có mặt: <span style="color:var(--success);">${hm(gatheringTime)}</span> ngày <span style="color:var(--success);">${gatheringDate}</span>
            ${isNightBefore ? '<span style="color:var(--warning);"> (Tối hôm trước!)</span>' : ''}
          </div>
          
          <div style="background:var(--surface-hover);padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px;line-height:1.6;">
            ${explanation}
          </div>

          <div style="font-size:13px;line-height:1.5;border-top:1px solid var(--border);padding-top:10px;">
            <b>📋 Quy tắc nghiệp vụ chung:</b><br>
            • <b>Bay quốc tế:</b> Tập trung trước 2–3 giờ<br>
            • <b>Đoàn đông (>15 người):</b> Tập trung trước <b>3 giờ</b> để có thời gian:<br>
            &nbsp;&nbsp;→ Điểm danh, phát tài liệu<br>
            &nbsp;&nbsp;→ Check-in, ký gửi hành lý<br>
            &nbsp;&nbsp;→ Hải quan, xuất cảnh, soi chiếu an ninh<br>
            • <b>Chuyến sau 0h:</b> Luôn tập trung <b>tối hôm trước</b>
          </div>
          
          <div style="margin-top:10px;padding:8px;background:var(--warning-bg);border-radius:6px;font-size:12px;">
            💡 <b>Mẹo nhớ:</b> Thấy giờ bay có số 00, 01, 02 → Tập trung tối hôm trước!
          </div>
        </div>
      </div>
    `;
  };
}

/* ==========================================================================
   TAB 3: QUICK SEARCH & REFERENCE (TRA CỨU NHANH)
   ========================================================================== */
function searchView() {
  V.innerHTML = `
    <div class="card-box">
      <div class="search-bar-wrapper">
        <span class="search-icon-pos">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Tìm mã vé, sân bay, visa, hành lý..." autofocus>
        <button id="clearSearchBtn" class="search-clear-btn" style="display:none;" title="Xóa">✕</button>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--text-sub);">
        <span id="searchCount">Đang hiển thị toàn bộ ${CARDS.length} thẻ ghi nhớ</span>
      </div>

      <div id="searchResults"></div>
    </div>
  `;

  const input = $("#searchInput");
  const clearBtn = $("#clearSearchBtn");
  const resultsBox = $("#searchResults");
  const countBox = $("#searchCount");

  function renderList(query) {
    const q = query.trim().toLowerCase();
    clearBtn.style.display = q ? "flex" : "none";

    const filtered = CARDS.filter(([front, back]) => {
      if (!q) return true;
      return front.toLowerCase().includes(q) || back.toLowerCase().includes(q);
    });

    countBox.textContent = `Tìm thấy ${filtered.length} / ${CARDS.length} mục`;

    if (!filtered.length) {
      resultsBox.innerHTML = `
        <div style="text-align:center;padding:28px 10px;color:var(--text-sub);">
          <div style="font-size:28px;margin-bottom:6px;">🔍</div>
          <p>Không tìm thấy nội dung phù hợp với "<b>${escapeHtml(query)}</b>"</p>
        </div>
      `;
      return;
    }

    resultsBox.innerHTML = filtered.map(([front, back]) => {
      return `
        <div class="ref-card-item">
          <div class="ref-title">
            <span>${escapeHtml(front)}</span>
          </div>
          <div class="ref-content">${escapeHtml(back)}</div>
        </div>
      `;
    }).join('');
  }

  input.oninput = e => renderList(e.target.value);
  clearBtn.onclick = () => {
    input.value = "";
    input.focus();
    renderList("");
  };
  renderList('');
}

// Initial launch
card();
</script>
